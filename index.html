<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurora Tours</title>
    <!-- link to Bootstrap files via CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <!-- link to Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand text-uppercase" href="#">
      Aurora Tours
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="#packages">Packages</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#faq">FAQ</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main>
  <section id="hero-carousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-indicators">
  <button
    type="button"
    data-bs-target="#hero-carousel"
    data-bs-slide-to="0"
    class="active"
    aria-current="true"
    aria-label="Slide 1"
  ></button>

  <button
    type="button"
    data-bs-target="#hero-carousel"
    data-bs-slide-to="1"
    aria-label="Slide 2"
  ></button>

  <button
    type="button"
    data-bs-target="#hero-carousel"
    data-bs-slide-to="2"
    aria-label="Slide 3"
  ></button>
</div>
    <div class="carousel-inner">
      <div class="carousel-item active c-item">
        <img src="images/slide1.jpg" class="d-block w-100 c-img" alt="Northern lights" />
        <div class="carousel-caption top-0 mt-4">
  <p class="mt-5 fs-3 text-uppercase">
    Discover the hidden world
  </p>
  <h1 class="display-1 fw-bolder text-capitalize">
    Aurora Tours
  </h1>
  <button class="btn btn-primary px-4 py-2 fs-5 mt-5">
    Book a Tour
  </button>
</div>
      </div>

      <div class="carousel-item c-item">
        <img src="images/slide2.jpg" class="d-block w-100 c-img" alt="Mountain landscape" /><div class="carousel-caption top-0 mt-4">
  <p class="mt-5 fs-3 text-uppercase">
    Experience the adventure
  </p>
  <h2 class="display-1 fw-bolder text-capitalize">
    Explore the Mountains
  </h2>
  <button class="btn btn-primary px-4 py-2 fs-5 mt-5">
    Book a Tour
  </button>
</div>
      </div>

      <div class="carousel-item c-item">
        <img src="images/slide3.jpg" class="d-block w-100 c-img" alt="Winter landscape" />
        <div class="carousel-caption top-0 mt-4">
  <p class="mt-5 fs-3 text-uppercase">
    Discover new destinations
  </p>
  <h2 class="display-1 fw-bolder text-capitalize">
    Winter Adventures
  </h2>
  <button class="btn btn-primary px-4 py-2 fs-5 mt-5">
    Book a Tour
  </button>
</div>
      </div>
    </div>
    <button
  class="carousel-control-prev"
  type="button"
  data-bs-target="#hero-carousel"
  data-bs-slide="prev"
>
  <span class="carousel-control-prev-icon" aria-hidden="true"></span>
  <span class="visually-hidden">Previous</span>
</button>

<button
  class="carousel-control-next"
  type="button"
  data-bs-target="#hero-carousel"
  data-bs-slide="next"
>
  <span class="carousel-control-next-icon" aria-hidden="true"></span>
  <span class="visually-hidden">Next</span>
</button>
  </section>
</main>
    
    <!-- link to BootStrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
